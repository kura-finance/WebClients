# Deploy to Cloud Run (official Kura production only).
# Forks and other remotes skip this job — copy the file and change the
# repository guard if you are self-hosting. See docs/deploy.md.

name: Deploy Web to GCP

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-app-${{ github.ref }}
  cancel-in-progress: true

# Infra config comes from GitHub Variables so the project can be relocated
# (see BackendServer/infra/gcp-migration). `vars.X || secrets.X` keeps the
# legacy Secret working until it is moved to a Variable.
env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  SERVICE_NAME: app
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    if: github.repository == 'Kura-Finance/WebClients'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t "gcr.io/${GCP_PROJECT_ID}/${SERVICE_NAME}:${{ github.sha }}" \
            -t "gcr.io/${GCP_PROJECT_ID}/${SERVICE_NAME}:latest" \
            --build-arg NEXT_PUBLIC_BACKEND_URL="${{ secrets.NEXT_PUBLIC_BACKEND_URL }}" \
            --build-arg NEXT_PUBLIC_APP_URL="${{ secrets.NEXT_PUBLIC_APP_URL }}" \
            --build-arg NEXT_PUBLIC_API_URL="${{ secrets.NEXT_PUBLIC_API_URL }}" \
            --build-arg NEXT_PUBLIC_PRIVY_APP_ID="${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}" \
            --build-arg NEXT_PUBLIC_REOWN_PROJECT_ID="${{ secrets.NEXT_PUBLIC_REOWN_PROJECT_ID }}" \
            --build-arg NEXT_PUBLIC_ALCHEMY_API_KEY="${{ secrets.NEXT_PUBLIC_ALCHEMY_API_KEY }}" \
            --build-arg NEXT_PUBLIC_BASE_RPC_URL="${{ secrets.NEXT_PUBLIC_BASE_RPC_URL }}" \
            --build-arg NEXT_PUBLIC_LOGODEV_TOKEN="${{ secrets.NEXT_PUBLIC_LOGODEV_TOKEN }}" \
            --build-arg NEXT_PUBLIC_PIMLICO_API_KEY="${{ secrets.NEXT_PUBLIC_PIMLICO_API_KEY }}" \
            --build-arg NEXT_PUBLIC_PAY_GAS_IN_USDC="${{ secrets.NEXT_PUBLIC_PAY_GAS_IN_USDC }}" \
            --build-arg NEXT_PUBLIC_LIFI_API_KEY="${{ secrets.NEXT_PUBLIC_LIFI_API_KEY }}" \
            --build-arg NEXT_PUBLIC_STRIPE_PRICE_PRO_MONTHLY="${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_PRO_MONTHLY }}" \
            --build-arg NEXT_PUBLIC_STRIPE_PRICE_PRO_YEARLY="${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_PRO_YEARLY }}" \
            --build-arg NEXT_PUBLIC_STRIPE_PRICE_ULTIMATE_MONTHLY="${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_ULTIMATE_MONTHLY }}" \
            --build-arg NEXT_PUBLIC_STRIPE_PRICE_ULTIMATE_YEARLY="${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_ULTIMATE_YEARLY }}" \
            -f ./Dockerfile \
            .

      - name: Push to Google Container Registry
        run: |
          docker push "gcr.io/${GCP_PROJECT_ID}/${SERVICE_NAME}:${{ github.sha }}"
          docker push "gcr.io/${GCP_PROJECT_ID}/${SERVICE_NAME}:latest"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --image="gcr.io/${GCP_PROJECT_ID}/${SERVICE_NAME}:${{ github.sha }}" \
            --region="${GCP_REGION}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=900 \
            --project="${GCP_PROJECT_ID}"

      - name: Output deployment URL
        run: |
          URL="$(gcloud run services describe "${SERVICE_NAME}" \
            --region="${GCP_REGION}" \
            --project="${GCP_PROJECT_ID}" \
            --format='value(status.url)')"
          echo "Deployed ${SERVICE_NAME} → ${URL}"
